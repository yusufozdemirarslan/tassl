services:
  postgres:
    image: postgres:17-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: tassl
      POSTGRES_PASSWORD: tassl
      POSTGRES_DB: tassl
    volumes:
      - tassl-pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tassl -d tassl']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  tassl-pg: {}
