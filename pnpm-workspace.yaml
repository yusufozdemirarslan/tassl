# pnpm settings (single package; no workspace members).
# No dependency lifecycle script runs (docs/tech/12-security.md §3 A08, D-146). These are the only
# packages in the tree that declare install scripts: esbuild loads its binary from the platform
# package, msw's postinstall only prints a notice, unrs-resolver's only checks its native binding.
allowBuilds:
  # @sentry/cli ships its binary in the platform package @sentry/cli-win32-x64 / -linux-x64, which
  # pnpm installs as an optional dependency; the install script only re-downloads when that package
  # is missing, so source-map upload works with the script off (D-561).
  '@sentry/cli': false
  # posthog-js pulls core-js in transitively; its postinstall only prints a funding notice.
  core-js: false
  esbuild: false
  msw: false
  unrs-resolver: false

# Dependency audit (12 §3 A06, D-149). `tmp` is forced to its patched line; both extract-zip
# advisories have no patched version and only affect @lhci/cli's browser-download path in CI —
# a devDependency that unpacks a Chrome build on a runner and never reaches a deployed bundle.
overrides:
  tmp: '>=0.2.6'
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    # Arbitrary file write through symlink archive entries; same package, same path, also unpatched.
    - GHSA-7pqw-9j4j-h8q3
minimumReleaseAgeExclude:
  - shadcn@4.20.1
