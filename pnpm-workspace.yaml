# pnpm settings (single package; no workspace members).
# No dependency lifecycle script runs (docs/tech/12-security.md §3 A08, D-146): esbuild works
# through its platform package and msw's postinstall only prints a notice.
allowBuilds:
  esbuild: false
  msw: false

# Dependency audit (12 §3 A06, D-149). `tmp` is forced to its patched line; the extract-zip
# advisory has no patched version and only affects @lhci/cli's browser-download path in CI.
overrides:
  tmp: '>=0.2.6'
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
