openapi: 3.1.0
info:
  title: Tassl API
  version: 1.0.0
  description: REST API for Tassl, the AI decision simulator for higher education. Generated from the Zod schemas in src/server/modules/*/schema.ts by `pnpm openapi:generate`. Every response carries an `x-request-id` header. Errors use the envelope in `#/components/schemas/ErrorEnvelope`.
servers:
  - url: /api/v1
    description: Same-origin, version 1
tags:
  - name: system
  - name: me
  - name: tenancy
  - name: courses
  - name: packages
  - name: runs
  - name: review
  - name: notifications
  - name: admin
security:
  - cookieAuth: []
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    cronAuth:
      type: http
      scheme: bearer
      description: CRON_SECRET
  parameters:
    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    claimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    courseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    dimension:
      name: dimension
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Dimension"
    elementId:
      name: elementId
      in: path
      required: true
      schema:
        type: string
    elementType:
      name: elementType
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ElementType"
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
    packageId:
      name: packageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestedWith:
      name: X-Requested-With
      in: header
      required: false
      schema:
        type: string
        enum:
          - tassl
      description: Required on non-GET cookie-authenticated requests
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: State conflict; code names the rule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NoContent:
      description: Done
    NotFound:
      description: Missing or cross-tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: No session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ActionResult:
      type: object
      required:
        - actionId
        - type
        - clockCostMs
        - result
        - inTurnWindow
      properties:
        actionId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ActionType"
        clockCostMs:
          type: integer
        result:
          type: object
          additionalProperties: true
        inTurnWindow:
          type: boolean
    ActionType:
      type: string
      enum:
        - source_trace
        - replication_check
        - decomposition_check
        - stakeholder_interview
    AdminUser:
      type: object
      required:
        - id
        - name
        - email
        - platformRole
        - deletedAt
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        platformRole:
          type: string
          enum:
            - none
            - tassl_scenario_editor
            - admin
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
    Assignment:
      type: object
      required:
        - id
        - sectionId
        - label
        - runType
        - packageVersionId
        - variantId
        - isWalkthrough
      properties:
        id:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        label:
          type: string
        runType:
          type: string
          enum:
            - decision
            - critique
        packageVersionId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        workingClockSeconds:
          type:
            - integer
            - "null"
        weight:
          type:
            - number
            - "null"
        isWalkthrough:
          type: boolean
        opensAt:
          type:
            - string
            - "null"
          format: date-time
    AssignmentView:
      allOf:
        - $ref: "#/components/schemas/Assignment"
        - type: object
          required:
            - packageTitle
            - packageVersion
            - variantKey
            - effectiveWorkingClockSeconds
            - effectiveWeight
          properties:
            packageTitle:
              type: string
            packageVersion:
              type: integer
            variantKey:
              type: string
              enum:
                - defective
                - sound
            effectiveWorkingClockSeconds:
              type: integer
            effectiveWeight:
              type: number
    AuditEntry:
      type: object
      required:
        - id
        - action
        - targetType
        - targetId
        - actorId
        - organizationId
        - requestId
        - createdAt
        - metadata
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        actorId:
          type:
            - string
            - "null"
        organizationId:
          type:
            - string
            - "null"
        requestId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuthoringMeasures:
      type: object
      required:
        - seedToConfirmedMs
        - editRate
        - rejectedShare
        - generationPasses
        - reviewMsPerElement
      properties:
        seedToConfirmedMs:
          type:
            - integer
            - "null"
        editRate:
          type: number
        rejectedShare:
          type: number
        generationPasses:
          type: integer
        reviewMsPerElement:
          type:
            - number
            - "null"
    Band:
      type: string
      enum:
        - novice
        - developing
        - proficient
        - professional
    BandDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - confirmed
            - overridden
            - unassessed
        band:
          $ref: "#/components/schemas/Band"
        note:
          type: string
          maxLength: 1000
    BandView:
      type: object
      required:
        - dimension
        - draft
        - decision
        - effectiveBand
        - correction
      properties:
        dimension:
          $ref: "#/components/schemas/Dimension"
        draft:
          type: object
          required:
            - band
            - status
            - reason
            - basis
            - provisional
            - graphKeys
            - evidenceEventSeqs
            - quotes
            - rationale
          properties:
            band:
              oneOf:
                - $ref: "#/components/schemas/Band"
                - type: "null"
            status:
              type: string
              enum:
                - drafted
                - unassessed
            reason:
              type: string
            basis:
              type: string
              enum:
                - trace
                - defense_only
                - categorical_only
                - none
            provisional:
              type: boolean
            graphKeys:
              type: array
              items:
                type: string
            evidenceEventSeqs:
              type: array
              items:
                type: integer
            quotes:
              type: array
              items:
                type: object
                properties:
                  eventSeq:
                    type: integer
                  text:
                    type: string
            rationale:
              type: string
        decision:
          type:
            - object
            - "null"
          properties:
            decision:
              type: string
              enum:
                - confirmed
                - overridden
                - unassessed
            band:
              oneOf:
                - $ref: "#/components/schemas/Band"
                - type: "null"
            note:
              type:
                - string
                - "null"
            decidedBy:
              type: string
            decidedAt:
              type: string
              format: date-time
        effectiveBand:
          oneOf:
            - $ref: "#/components/schemas/Band"
            - type: string
              enum:
                - unassessed
            - type: "null"
        correction:
          type:
            - object
            - "null"
          properties:
            before:
              $ref: "#/components/schemas/Band"
            after:
              $ref: "#/components/schemas/Band"
    Brief:
      type: object
      required:
        - recommendation
        - rationale
        - assumptions
        - changeMyMind
        - confidence
        - namedValues
      properties:
        recommendation:
          type: string
        rationale:
          type: string
        assumptions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
        changeMyMind:
          type: string
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        namedValues:
          type: object
          additionalProperties:
            type: number
    BriefDraft:
      type: object
      properties:
        recommendation:
          type: string
        rationale:
          type: string
        assumptions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
        changeMyMind:
          type: string
        confidence:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100
        namedValues:
          type: object
          additionalProperties:
            type: number
    BriefSignal:
      oneOf:
        - type: object
          required:
            - opened
          properties:
            opened:
              type: boolean
              const: true
        - type: object
          required:
            - closed
            - durationMs
          properties:
            closed:
              type: boolean
              const: true
            durationMs:
              type: integer
              minimum: 0
    ClaimObjectView:
      type: object
      required:
        - id
        - key
        - text
        - sourceKind
        - importance
        - consequenceLevel
        - verificationCost
        - conceptKey
        - triggerPhrases
        - escalatable
        - rationale
        - states
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        text:
          type: string
        sourceKind:
          type: string
          enum:
            - assistant
            - document
        source:
          type:
            - object
            - "null"
          properties:
            documentId:
              type: string
            title:
              type: string
            datedOn:
              type: string
              format: date
            author:
              type: string
            passage:
              type: string
        importance:
          type: string
          enum:
            - load_bearing
            - supporting
        consequenceLevel:
          type: string
          enum:
            - low
            - medium
            - high
        verificationCost:
          type: string
          enum:
            - cheap
            - moderate
            - expensive
        weaklySourced:
          type: boolean
        volatile:
          type: boolean
        conceptKey:
          type: string
        carriedValues:
          type: array
          items:
            type: object
            additionalProperties: true
        triggerPhrases:
          type: array
          items:
            type: string
        escalatable:
          type: boolean
        escalationReply:
          type:
            - string
            - "null"
        rationale:
          type: string
        states:
          type: array
          items:
            $ref: "#/components/schemas/VariantClaimState"
        confirmation:
          oneOf:
            - $ref: "#/components/schemas/ElementConfirmation"
            - type: "null"
    ClaimView:
      type: object
      required:
        - id
        - key
        - text
        - surfacedBy
        - surfacedAt
        - inTurnWindow
        - stance
        - previousStance
        - actions
        - availableActions
        - escalatable
        - escalation
        - usedMarked
        - reliedOn
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        text:
          type: string
        surfacedBy:
          type: string
          enum:
            - delegation
            - document
            - turn
            - student
        surfacedAt:
          type: string
          format: date-time
        inTurnWindow:
          type: boolean
        stance:
          oneOf:
            - $ref: "#/components/schemas/Stance"
            - type: "null"
        previousStance:
          oneOf:
            - $ref: "#/components/schemas/Stance"
            - type: "null"
        stanceSetAt:
          type:
            - string
            - "null"
          format: date-time
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionResult"
        availableActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionType"
        escalatable:
          type: boolean
        escalation:
          oneOf:
            - $ref: "#/components/schemas/EscalationResult"
            - type: "null"
        usedMarked:
          type: boolean
        reliedOn:
          type: boolean
    Clock:
      type: object
      required:
        - remainingMs
        - paused
        - creditedMs
        - chargedMs
      properties:
        remainingMs:
          type: integer
        paused:
          type: boolean
        creditedMs:
          type: integer
        chargedMs:
          type: integer
    Course:
      type: object
      required:
        - id
        - organizationId
        - name
        - term
        - outsideAiPolicy
        - mapping
        - defaultRunWeight
        - critiqueWeightFactor
        - taughtConcepts
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
        name:
          type: string
        term:
          type: string
        outsideAiPolicy:
          type: string
          enum:
            - open
            - declared
            - in_environment_only
        mapping:
          $ref: "#/components/schemas/Mapping"
        defaultRunWeight:
          type: number
        critiqueWeightFactor:
          type: number
        taughtConcepts:
          type: array
          items:
            type: string
    CourseView:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          required:
            - sections
            - assignments
          properties:
            sections:
              type: array
              items:
                $ref: "#/components/schemas/Section"
            assignments:
              type: array
              items:
                $ref: "#/components/schemas/Assignment"
    CreateAssignment:
      type: object
      required:
        - label
        - packageVersionId
        - variantId
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        packageVersionId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        workingClockSeconds:
          type: integer
          minimum: 60
        weight:
          type: number
          minimum: 0
        isWalkthrough:
          type: boolean
          default: false
        opensAt:
          type: string
          format: date-time
    CreateCourse:
      type: object
      required:
        - name
        - term
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        term:
          type: string
          minLength: 1
        outsideAiPolicy:
          type: string
          enum:
            - open
            - declared
            - in_environment_only
          default: declared
        mapping:
          $ref: "#/components/schemas/Mapping"
        defaultRunWeight:
          type: number
          minimum: 0
          default: 2.5
        taughtConcepts:
          type: array
          items:
            type: string
    CreatePackageFromSeed:
      type: object
      required:
        - title
        - familyKey
        - conceptSet
        - seed
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        familyKey:
          type: string
          pattern: ^[a-z0-9-]{3,60}$
        conceptSet:
          type: array
          minItems: 4
          items:
            type: string
            minLength: 2
        seed:
          $ref: "#/components/schemas/SeedInput"
    DataAgreement:
      allOf:
        - $ref: "#/components/schemas/DataAgreementInput"
        - type: object
          required:
            - id
            - organizationId
          properties:
            id:
              type: string
              format: uuid
            organizationId:
              type: string
    DataAgreementInput:
      type: object
      required:
        - counterparty
        - permittedPlatformRoles
        - purposes
        - retentionDays
        - documentReference
        - signedAt
      properties:
        counterparty:
          type: string
          minLength: 1
        permittedPlatformRoles:
          type: array
          items:
            type: string
            enum:
              - tassl_scenario_editor
        purposes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - scoring_audit
              - scenario_calibration
              - drift_review
        recordTypesCovered:
          type: array
          items:
            type: string
        recordTypesExcluded:
          type: array
          items:
            type: string
        retentionDays:
          type: integer
          minimum: 1
        documentReference:
          type: string
        signedAt:
          type: string
          format: date-time
        endsAt:
          type:
            - string
            - "null"
          format: date-time
    DebriefAnswers:
      type: object
      required:
        - stanceToChange
        - doDifferently
      properties:
        stanceToChange:
          type: string
          minLength: 1
        doDifferently:
          type: string
          minLength: 1
    DebriefView:
      type: object
      required:
        - run
        - sections
        - bands
        - points
        - questions
        - doneWell
        - labels
      properties:
        run:
          $ref: "#/components/schemas/RunSummary"
        sections:
          type: array
          items:
            type: object
            required:
              - key
              - available
            properties:
              key:
                type: string
              available:
                type: boolean
              reason:
                type: string
              data: {}
        bands:
          type: array
          items:
            $ref: "#/components/schemas/BandView"
        points:
          type: object
          required:
            - mapping
            - weight
            - draft
            - confirmed
          properties:
            mapping:
              $ref: "#/components/schemas/Mapping"
            weight:
              type: number
            draft:
              type:
                - number
                - "null"
            confirmed:
              type:
                - number
                - "null"
        questions:
          type: object
          required:
            - answered
          properties:
            answered:
              type: boolean
            stanceToChange:
              type:
                - string
                - "null"
            doDifferently:
              type:
                - string
                - "null"
        doneWell:
          type: string
        labels:
          type: object
          required:
            - uncalibrated
            - draft
          properties:
            uncalibrated:
              type: boolean
            draft:
              type: boolean
    DefenseAnswer:
      type: object
      required:
        - text
        - durationMs
      properties:
        text:
          type: string
          maxLength: 5000
        durationMs:
          type: integer
          minimum: 0
    DefenseQuestion:
      type: object
      required:
        - runQuestionId
        - seq
        - kind
        - text
        - answered
        - followUpOf
      properties:
        runQuestionId:
          type: string
          format: uuid
        seq:
          type: integer
        kind:
          type: string
          enum:
            - provenance
            - figure_provenance
            - verification
            - assumption
            - confidence
            - frame_vs_response
            - counterfactual
            - default
        text:
          type: string
        answered:
          type: boolean
        followUpOf:
          type:
            - string
            - "null"
          format: uuid
    DefenseView:
      type: object
      required:
        - questions
        - artifacts
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/DefenseQuestion"
        artifacts:
          type: object
          required:
            - frame
            - brief
            - turnResponse
          properties:
            frame:
              $ref: "#/components/schemas/Frame"
            brief:
              $ref: "#/components/schemas/Brief"
            turnResponse:
              type: object
              properties:
                response:
                  $ref: "#/components/schemas/TurnResponseKind"
                justification:
                  type:
                    - string
                    - "null"
                confidence:
                  type:
                    - integer
                    - "null"
                implicit:
                  type: boolean
    DelegationView:
      type: object
      required:
        - id
        - seq
        - requestText
        - responseText
        - claims
        - why
        - flags
        - inTurnWindow
        - failed
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
        requestText:
          type: string
        responseText:
          type: string
        claims:
          type: array
          items:
            $ref: "#/components/schemas/ClaimView"
        why:
          type:
            - string
            - "null"
        flags:
          type: array
          items:
            type: string
        unverifiedNumbers:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              context:
                type: string
        inTurnWindow:
          type: boolean
        failed:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Dimension:
      type: string
      enum:
        - framing
        - delegation
        - verification
        - calibration
        - decision_quality
        - adaptation
        - ownership
    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required:
            - body
          properties:
            body:
              type: string
    DocumentSummary:
      type: object
      required:
        - id
        - key
        - title
        - author
        - datedOn
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        author:
          type: string
        datedOn:
          type: string
          format: date
    ElementConfirmation:
      type: object
      required:
        - elementType
        - elementId
        - revision
        - decision
        - decidedBy
        - decidedAt
        - openedAt
      properties:
        elementType:
          $ref: "#/components/schemas/ElementType"
        elementId:
          type:
            - string
            - "null"
        revision:
          type: integer
        decision:
          type: string
          enum:
            - confirmed
            - edited
            - rejected
        note:
          type: string
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        openedAt:
          type: string
          format: date-time
    ElementDecision:
      type: object
      required:
        - decision
        - openedAt
      properties:
        decision:
          type: string
          enum:
            - confirmed
            - rejected
        note:
          type: string
          maxLength: 1000
        openedAt:
          type: string
          format: date-time
    ElementType:
      type: string
      enum:
        - brief
        - document
        - stakeholder
        - answer_space_position
        - named_field
        - claim
        - variant_claim_state
        - probe
        - turn
        - defense_question
        - readiness_item
        - counterfactual
        - general_escalation_reply
        - clock_and_difficulty
        - seed_reskin
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
