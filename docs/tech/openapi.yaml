  /../internal/jobs/drain:
    get:
      tags:
        - system
      operationId: drainJobsCron
      summary: Drain job queues and run daily maintenance (Vercel Cron)
      security:
        - cronAuth: []
      servers:
        - url: /api
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  failed:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  skippedQueues:
                    type: array
                    items:
                      type: string
                  durationMs:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - processed
                  - failed
                  - skippedQueues
                  - durationMs
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags:
        - system
      operationId: drainJobs
      summary: Drain job queues and run daily maintenance (manual)
      security:
        - cronAuth: []
      servers:
        - url: /api
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  failed:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  skippedQueues:
                    type: array
                    items:
                      type: string
                  durationMs:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - processed
                  - failed
                  - skippedQueues
                  - durationMs
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthenticated"
