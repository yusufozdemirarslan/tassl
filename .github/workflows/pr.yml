name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      pull-requests: read

  preview-deploy:
    name: preview-deploy
    needs: checks
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PR_NUMBER: ${{ github.event.number }}
      PREVIEW_ALIAS: tassl-pr-${{ github.event.number }}.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # D-071: one Neon branch per PR, created (or reused) before the deployment exists.
      - name: Create the Neon preview branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Assert branch outputs
        run: |
          test -n "${{ steps.neon.outputs.db_url }}"
          test -n "${{ steps.neon.outputs.db_url_pooled }}"

      # D-070: migrate before serving. Migrations use the unpooled string.
      - name: Migrate the preview branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm db:migrate

      - name: Pull preview project settings
        run: npx vercel@59.11.2 pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build
        env:
          APP_ENV: preview
          NEXT_PUBLIC_APP_URL: https://${{ env.PREVIEW_ALIAS }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          # D-160: sensitive Vercel variables are not pulled onto the runner, so the build reads them
          # from GitHub secrets; the deployment itself still uses the Vercel preview values.
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_PREVIEW }}
          CRON_SECRET: ${{ secrets.CRON_SECRET_PREVIEW }}
        run: npx vercel@59.11.2 build --token "$VERCEL_TOKEN"

      # D-161: the runner's checkout would attach git metadata, and Vercel then blocks the
      # deployment unless the commit author is a verified member of the Vercel team
      # (TEAM_ACCESS_REQUIRED). Deploying the prebuilt output without the .git directory skips
      # that check; the PR number and sha stay in the alias and the job log.
      - name: Detach git metadata
        run: mv .git "$RUNNER_TEMP/git-detached"

      - name: Deploy and alias
        timeout-minutes: 10
        run: |
          npx vercel@59.11.2 deploy --prebuilt --token "$VERCEL_TOKEN" \
            --env DATABASE_URL="${{ steps.neon.outputs.db_url_pooled }}" \
            --env DATABASE_URL_UNPOOLED="${{ steps.neon.outputs.db_url }}" \
            --env APP_ENV=preview \
            --env NEXT_PUBLIC_APP_URL="https://$PREVIEW_ALIAS" \
            > deployment-url.txt
          npx vercel@59.11.2 alias set "$(cat deployment-url.txt)" "$PREVIEW_ALIAS" --token "$VERCEL_TOKEN"

      # D-161: the CLI polls forever on states it does not know (BLOCKED), so a failed or timed-out
      # deploy prints the newest deployment's state and reason from the API instead.
      - name: Explain a failed deployment
        if: failure()
        run: |
          curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=1" \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const d=(JSON.parse(s).deployments||[])[0]||{};console.log("newest deployment:",d.url,d.state,d.readyState||"",JSON.stringify(d.readyStateReason||d.errorMessage||""))})'

      - name: Comment the preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$(printf 'Preview: https://%s\nDeployment: %s\nNeon branch: preview/pr-%s\n(Vercel Authentication is on for previews, D-101)' "$PREVIEW_ALIAS" "$(cat deployment-url.txt)" "$PR_NUMBER")"
