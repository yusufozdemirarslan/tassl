name: restore-drill

# NFR-015, D-069, docs/tech/13-observability-ops.md §8.4. A backup that has never been restored is
# not a backup, so the drill is the deliverable and it runs on a schedule rather than waiting for
# someone to remember it: Monday mornings, matching the weekly cadence in the post-launch runbook.
# `scripts/restore-drill.sh` already writes GITHUB_STEP_SUMMARY and checks in to Sentry as a cron
# monitor; it had simply never had a workflow to call it (D-681).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The drill downloads the nightly artifact, so it must never run beside the nightly dump's own
# window on the same project, and two drills would collide on one branch name.
concurrency:
  group: restore-drill
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # gh run list / gh run download, for the backup.yml artifact

# `next build` validates the whole server environment (D-678), and so does the server the drill
# starts, so both need the non-secret defaults of 05-environment-config.md — the same block
# `checks.yml` carries. The drill's own commands override DATABASE_URL and friends per branch.
env:
  APP_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  APP_DOMAIN: ''
  LOG_LEVEL: info
  DATABASE_URL: postgres://tassl:tassl@localhost:5432/tassl_test
  DATABASE_URL_UNPOOLED: postgres://tassl:tassl@localhost:5432/tassl_test
  TEST_DATABASE_URL: postgres://tassl:tassl@localhost:5432/tassl_test
  BETTER_AUTH_SECRET: local-dev-secret-do-not-use-in-prod-0123456789
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  EMAIL_TRANSPORT: console
  RESEND_API_KEY: ''
  EMAIL_FROM: 'Tassl <no-reply@tassl.local>'
  NOTIFY_EMAIL_COPIES: 'true'
  FEATURE_AI: 'false'
  FEATURE_SAMPLE_DATA: 'true'
  FEATURE_TEST_CONTROLS: 'true'
  LLM_PROVIDER: mock
  LLM_BASE_URL: https://token-plan-sgp.xiaomimimo.com/v1
  LLM_MODEL: mimo-v2.5-pro
  LLM_API_KEY: ''
  LLM_TIMEOUT_MS: '60000'
  LLM_MAX_OUTPUT_TOKENS: '4096'
  LLM_REASONING: 'off'
  LLM_FALLBACK_PROVIDER: none
  LLM_FALLBACK_MODEL: claude-sonnet-5
  ANTHROPIC_API_KEY: ''
  LLM_INPUT_USD_PER_MTOK: '0.61'
  LLM_OUTPUT_USD_PER_MTOK: '0.61'
  LLM_USER_DAILY_TOKEN_BUDGET: '200000'
  LLM_GLOBAL_MONTHLY_TOKEN_BUDGET: '20000000'
  TRIGGER_MATCHING: deterministic_first
  ASSISTANT_NUMERIC_GUARD: flag
  NEXT_PUBLIC_POSTHOG_KEY: ''
  NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
  NEXT_PUBLIC_SENTRY_DSN: ''
  SENTRY_AUTH_TOKEN: ''
  SENTRY_ORG: ''
  SENTRY_PROJECT: tassl
  SENTRY_TRACES_SAMPLE_RATE: '1.0'
  CRON_SECRET: local-cron-secret
  JOBS_DRAIN_ON_ENQUEUE: 'true'
  SEED_PASSWORD: Walkthrough-Pass-2026
  PLAYWRIGHT_BASE_URL: http://localhost:3000

jobs:
  drill:
    name: drill
    runs-on: ubuntu-latest
    # The NFR-015 RTO target is 3600 s and the script reports its own duration against it; the job
    # ceiling is deliberately higher so a slow-but-passing drill is still recorded as a pass.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Neon runs Postgres 17 and the runner image ships a 16 client that `/usr/bin/pg_restore`
      # keeps resolving to; the same PATH fix the nightly backup needed (D-680).
      - name: Install postgresql-client-17
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      # Step 4 of the drill starts a real server against the restored branch, so the build has to
      # exist before the clock starts; `pnpm build` inside the script would be counted as restore time.
      - run: pnpm build

      - name: Restore drill
        env:
          GH_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: bash scripts/restore-drill.sh
