title = "Tassl gitleaks configuration"

[extend]
useDefault = true

# Two allowlists on purpose: paths and regexes in one entry are combined with AND by gitleaks, so
# the documented defaults must be allowed wherever they appear (config defaults, the seed, tests).
[[allowlists]]
description = "The example environment file only carries documented non-secret defaults (05 §1)"
paths = ['''\.env\.example$''']

[[allowlists]]
description = "Documented non-secret defaults from docs/tech/05-environment-config.md, wherever they appear"
regexTarget = "match"
regexes = [
  '''local-dev-secret-do-not-use-in-prod-0123456789''',
  '''local-cron-secret''',
  '''Walkthrough-Pass-2026''',
  '''postgres://tassl:tassl@localhost:5432/tassl(_test)?''',
]

# Content allowlists rather than `.gitleaksignore` fingerprints, because a fingerprint carries the
# commit that introduced the line and a squash merge gives that line a new commit. Every waiver
# below was first written as a fingerprint against a PR branch commit, went green on the PR, and
# stopped applying the moment the branch was squashed onto `main` (D-682).
[[allowlists]]
description = "Deliberately fake credentials in the Sentry scrubber's own test: the test exists to prove these are removed from an event, so it has to contain secret-shaped strings"
paths = ['''tests/unit/observability/sentry-scrub\.test\.ts$''']

[[allowlists]]
description = "Two documented fakes, allowed by content rather than by path because they are quoted in DECISIONS.md as well as used in tests: the synthetic Resend key in the Sentry scrubber's fixture, and the Idempotency-Key two tests retry with (a ULID the client picks, so high-entropy by design)"
regexTarget = "match"
regexes = [
  '''re_live_1234567890''',
  '''01J8Z4S8Q5B3F1V6E9K2N7M0TA''',
]

[[allowlists]]
description = "Question-bank identifiers in the generation prompt's example output (Q_ASSUMPTION_0, Q_FIGURE_PROVENANCE, ...). Authored keys, flagged only because the field is spelled `key`"
regexTarget = "match"
regexes = ['''Q_[A-Z][A-Z0-9_]{2,}''']
